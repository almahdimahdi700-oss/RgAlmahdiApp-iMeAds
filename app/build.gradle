plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rgalmahdi.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.rgalmahdi.app"
        minSdk 21
        targetSdk 34
        versionCode 8
        versionName "8.0 GOLD DIAMOND PRO MAX"

        // هذا يصلح مشكلة منتجات غير مطابقة
        manifestPlaceholders = [startappAppId: "209205885"]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.9.0'
    
    // === Start.io الذهبي الماسي الجديد 5.3.1 - يحل مشكلة غير محدد ===
    implementation 'com.startapp:inapp-sdk:5.3.1'
}
